# Alembic configuration for developers (creating new migrations).
# The app itself runs migrations on startup (app/database/migrate.py),
# so you only need this file to write a new migration:
#
#   cd backend
#   alembic revision --autogenerate -m "describe the change"
#
# The database URL comes from DATABASE_URL (default: sqlite:///./branchpoint.db).

[alembic]
script_location = app/database/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
