# Start everything:   docker compose up --build
# App:                http://localhost:8000
# API docs:           http://localhost:8000/docs
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: branchpoint
      POSTGRES_PASSWORD: branchpoint
      POSTGRES_DB: branchpoint
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U branchpoint"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://branchpoint:branchpoint@db:5432/branchpoint
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
