# One-click deployment on Render (https://render.com): New -> Blueprint -> pick this repository.
# Creates the web app (built from the Dockerfile) and a PostgreSQL database, and wires them together.
services:
  - type: web
    name: branchpoint
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: branchpoint-db
          property: connectionString

databases:
  - name: branchpoint-db
    plan: free
    databaseName: branchpoint
    user: branchpoint
