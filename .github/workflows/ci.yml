# Runs every test on each push and pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: branchpoint
          POSTGRES_PASSWORD: branchpoint
          POSTGRES_DB: branchpoint_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U branchpoint" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests on SQLite
        run: python -m pytest -q
      - name: Tests on PostgreSQL
        run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://branchpoint:branchpoint@localhost:5432/branchpoint_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t branchpoint .
      - name: Start it and check /health and the domains catalog
        run: |
          docker run -d --name bp -p 8000:8000 branchpoint
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/api/domains | grep -q cold_chain
          curl -sf localhost:8000/ | grep -q Branchpoint
